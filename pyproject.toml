[project]
name = "copydc"
version = "1.0.0"
description = "Bot modular de utilidades y automatización para Discord."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7.1,<3",
    "aiohttp>=3.13,<4",
    "python-dotenv>=1.1,<2",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools]
py-modules = ["main", "database", "command_utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "admin_modules*", "scripts*"]
exclude = ["tests*", "logs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["logs", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
